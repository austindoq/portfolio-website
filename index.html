<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Austin Doquiatan</title>
    <script src="index.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="font-archivo flex flex-col min-h-screen">
    <nav id="nav" class="flex p-4 bg-[#434446]">
      <h1
        class="font-extrabold text-4xl text-[#eae3e3] w-full text-center tracking-wide"
      >
        Austin Doquiatan
      </h1>
    </nav>
    <main
      id="hero"
      class="bg-[#6a3e40] flex gap-4 justify-between flex-1 w-full p-4"
    >
      <aside
        id="project-select-container"
        class="basis-[30%] flex flex-col gap-8 items-center border py-8 text-xl"
      >
      <div id="aside-header">
        <h1 class="underline">Recent Projects</h1>
      </div>
      <div id="project-selection" class="flex flex-col gap-4">
        <div id="project-1">
          <img src="./images/test-img.png" class="object-cover rounded-md hover:brightness-100 brightness-70">
        </div>
        <div id="project-2">
          <img src="./images/test-img-2.png" class="object-cover rounded-md hover:brightness-100 brightness-70">
        </div>
      </div>
      </aside>
      <section
        id="content-area-container"
        class="basis-[70%] border p-8"
      >
        <h1>HAHADAW</h1>
      </section>
    </main>
    <footer id="footer" class="p-2 bg-[#57595B]"></footer>
  </body>
</html>
